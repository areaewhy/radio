<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio</title>
<style>
  :root { --c: #8AFB17; color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f4f4f4;
         background: radial-gradient(ellipse at top, color-mix(in srgb, var(--c) 35%, #000) 0%, #0b0b0b 70%); }
  main { text-align: center; padding: 2rem; max-width: 32rem; }
  a.back { position: fixed; top: 1rem; left: 1rem; color: inherit; opacity: .6; text-decoration: none; }
  h1 { font-size: .9rem; letter-spacing: .25em; text-transform: uppercase; color: var(--c); margin: 0 0 1.5rem; }
  #title { font-size: 1.7rem; font-weight: 650; margin: .5rem 0 .25rem; }
  #artist { opacity: .75; margin: 0 0 2rem; min-height: 1.2em; }
  button { font: inherit; font-size: 1.1rem; padding: .7rem 2.2rem; border-radius: 99px; cursor: pointer;
           border: 2px solid var(--c); background: none; color: var(--c); }
  button.on { background: var(--c); color: #0b0b0b; }
  input[type=range] { display: block; margin: 1.5rem auto 0; width: 12rem; accent-color: var(--c); }
</style>
</head>
<body>
<a class="back" href="/">&larr; all stations</a>
<main>
  <h1 id="name">&nbsp;</h1>
  <p id="title">&nbsp;</p>
  <p id="artist"></p>
  <button id="play" type="button">Tune in</button>
  <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
</main>
<audio id="audio" preload="none"></audio>
<script>
  const name = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  const audio = document.getElementById('audio');
  const btn = document.getElementById('play');
  document.getElementById('name').textContent = name;
  audio.volume = 0.8;
  document.getElementById('vol').oninput = e => audio.volume = e.target.value;

  // Live radio: Stop disconnects; Tune in rejoins wherever the broadcast is now.
  btn.onclick = () => {
    if (audio.paused) {
      audio.src = '/stream/' + encodeURIComponent(name) + '?t=' + Date.now();
      audio.play();
      btn.textContent = 'Stop'; btn.classList.add('on');
    } else {
      audio.pause(); audio.removeAttribute('src'); audio.load();
      btn.textContent = 'Tune in'; btn.classList.remove('on');
    }
  };

  async function refresh() {
    try {
      const r = await fetch('/nowplaying/' + encodeURIComponent(name), { cache: 'no-store' });
      if (r.status === 404) { document.getElementById('title').textContent = 'No such station'; btn.disabled = true; return; }
      const m = await r.json();
      document.documentElement.style.setProperty('--c', m.color);
      if (m.hidden) document.querySelector('a.back')?.remove();
      document.getElementById('title').textContent = m.title || (m.listeners ? 'Loading…' : 'Tune in to start');
      document.getElementById('artist').textContent = [m.artist, m.album].filter(Boolean).join(' — ');
      document.title = (m.title ? m.title + ' · ' : '') + name;
    } catch { /* station offline; keep last value */ }
  }
  refresh();
  setInterval(refresh, 10000);
</script>
</body>
</html>
