<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; background: #0b0b0b; color: #f4f4f4; }
  main { max-width: 40rem; margin: 0 auto; padding: 3rem 1.25rem; }
  h1 { font-size: .9rem; letter-spacing: .25em; text-transform: uppercase; opacity: .6; margin: 0 0 2rem; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: .75rem; }
  a { display: grid; grid-template-columns: auto 1fr auto; gap: 1rem; align-items: center;
      padding: 1rem 1.25rem; border-radius: 14px; text-decoration: none; color: inherit;
      background: #161616; border-left: 6px solid var(--c); }
  a:hover { background: color-mix(in srgb, var(--c) 14%, #161616); }
  .dot { width: .7rem; height: .7rem; border-radius: 50%; background: var(--c); }
  .name { font-weight: 650; font-size: 1.15rem; }
  .now { opacity: .65; font-size: .9rem; margin-top: .15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { opacity: .5; font-size: .85rem; text-align: right; white-space: nowrap; }
  .empty { opacity: .6; }
</style>
</head>
<body>
<main>
  <h1>Stations</h1>
  <ul id="list"><li class="empty">Loading…</li></ul>
</main>
<script>
  const list = document.getElementById('list');
  async function refresh() {
    try {
      const stations = await (await fetch('/stations', { cache: 'no-store' })).json();
      list.replaceChildren(...(stations.length ? stations.map(s => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '/listen/' + encodeURIComponent(s.name);
        a.style.setProperty('--c', s.color);
        const dot = Object.assign(document.createElement('span'), { className: 'dot' });
        const mid = document.createElement('div');
        mid.append(Object.assign(document.createElement('div'), { className: 'name', textContent: s.name }),
                   Object.assign(document.createElement('div'), { className: 'now',
                     textContent: s.title ? [s.title, s.artist].filter(Boolean).join(' — ') : 'Idle' }));
        const meta = Object.assign(document.createElement('div'), { className: 'meta',
          textContent: s.tracks.toLocaleString() + ' tracks' + (s.listeners ? ' · ' + s.listeners + ' listening' : '') });
        a.append(dot, mid, meta);
        li.append(a);
        return li;
      }) : [Object.assign(document.createElement('li'), { className: 'empty', textContent: 'No stations yet.' })]));
    } catch { /* offline; keep last list */ }
  }
  refresh();
  setInterval(refresh, 15000);
</script>
</body>
</html>
