<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
  main { text-align: center; padding: 2rem; max-width: 32rem; }
  h1 { font-size: 1rem; letter-spacing: .2em; text-transform: uppercase; opacity: .6; }
  #title { font-size: 1.6rem; font-weight: 600; margin: .5rem 0 .25rem; }
  #artist { opacity: .75; margin: 0 0 2rem; min-height: 1.2em; }
  button { font: inherit; font-size: 1.1rem; padding: .7rem 2.2rem; border-radius: 99px;
           border: 2px solid currentColor; background: none; color: inherit; cursor: pointer; }
  input[type=range] { display: block; margin: 1.5rem auto 0; width: 12rem; }
</style>
</head>
<body>
<main>
  <h1>On air</h1>
  <p id="title">&nbsp;</p>
  <p id="artist"></p>
  <button id="play" type="button">Play</button>
  <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
</main>
<audio id="audio" preload="none"></audio>
<script>
  const audio = document.getElementById('audio');
  const btn = document.getElementById('play');
  audio.volume = 0.8;
  document.getElementById('vol').oninput = e => audio.volume = e.target.value;

  btn.onclick = () => {
    if (audio.paused) {
      // Fresh URL each time so we join live instead of resuming a stale buffer.
      audio.src = '/stream?t=' + Date.now();
      audio.play();
      btn.textContent = 'Stop';
    } else {
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
      btn.textContent = 'Play';
    }
  };

  async function refresh() {
    try {
      const m = await (await fetch('/nowplaying', { cache: 'no-store' })).json();
      document.getElementById('title').textContent = m.title || 'Untitled';
      document.getElementById('artist').textContent = [m.artist, m.album].filter(Boolean).join(' — ');
      if (m.title) document.title = m.title + ' · Radio';
    } catch { /* station offline; keep last value */ }
  }
  refresh();
  setInterval(refresh, 10000);
</script>
</body>
</html>
