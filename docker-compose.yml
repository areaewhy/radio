services:
  radio:
    image: ghcr.io/areaewhy/radio:latest   # server: docker compose pull
    build: .                               # local:  docker compose up -d --build
    restart: unless-stopped
    ports:
      - "80:8000"          # Cloudflare (Flexible SSL) -> VM:80 -> container:8000
    environment:
      BITRATE: "128"
      PREFETCH: "3"        # tracks downloaded ahead of the one playing
    volumes:
      - ./playlist.json:/radio/playlist.json:ro
      - radio-data:/data   # play position, survives restarts
volumes:
  radio-data:
